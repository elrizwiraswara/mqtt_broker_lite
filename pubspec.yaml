name: dart_mqtt_broker
description: A pure-Dart MQTT 3.1.1 broker. Supports wildcards, retained messages, QoS 0/1/2, will messages, authentication, TLS, and WebSocket transport.
version: 2.1.0
homepage: https://github.com/elrizwiraswara/dart_mqtt_broker
repository: https://github.com/elrizwiraswara/dart_mqtt_broker

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
  mqtt_client: ^10.0.0

platforms:
  android:
  ios:
  macos:
  windows:
  linux:

topics:
  - mqtt
  - broker
  - iot
  - pubsub
  - networking
